name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every query is a runtime query (no sqlx macros), so the test suite needs no database.
      - run: cargo test --workspace --locked

  go:
    name: go adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: adapters/go/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  web:
    name: web (lint, types, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  seeds:
    name: cavp vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The answer keys are generated, not hand-written: regenerating them must be a no-op,
      # otherwise the checked-in keys and the browser's library have drifted apart.
      - run: npm install --prefix tools
      - run: node tools/gen-algorithms.mjs && node tools/gen-cavp-vectors.mjs
      - run: git diff --exit-code deploy/seeds

  e2e:
    name: end-to-end (compose + playwright)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start the stack
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yml up -d --build
      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8088/readyz; then exit 0; fi
            sleep 5
          done
          docker compose -f deploy/compose.yml logs --tail=200
          exit 1
      - run: pnpm --filter web e2e
        env:
          E2E_BASE_URL: http://localhost:8088
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail=400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
